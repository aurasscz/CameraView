# go2rtc configuration for CameraView.
# CameraView registers your cameras here automatically through the API,
# but you can also list them by hand under "streams".

api:
  listen: ":1984"
  # Allow the CameraView web app (e.g. on GitHub Pages) to call this gateway.
  origin: "*"
  # Serve the CameraView app itself at http://<this-computer>:1984/
  static_dir: "../web"

rtsp:
  # Re-stream cameras over RTSP on port 8554 (optional, handy for VLC etc.)
  listen: ":8554"

webrtc:
  listen: ":8555"

log:
  level: info

streams:
  # Example:
  # front_door: rtsp://user:password@192.168.1.20:554/stream1
